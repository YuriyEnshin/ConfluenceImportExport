# Example Codex CLI configuration for the Confluence Page Exporter MCP server.
# Place into ~/.codex/config.toml (or merge with existing mcp_servers section).

[mcp_servers.confluence]
command = "/usr/local/bin/ConfluencePageExporter"
args = [
    "mcp",
    "--root-dir", "/home/you/confluence-mirror",
]

[mcp_servers.confluence.env]
CONFLUENCE_EXPORTER__Global__BaseUrl   = "https://your-company.atlassian.net/wiki"
CONFLUENCE_EXPORTER__Global__Username  = "you@your-company.com"
CONFLUENCE_EXPORTER__Global__Token     = "<API_TOKEN>"
CONFLUENCE_EXPORTER__Global__SpaceKey  = "DOCS"
CONFLUENCE_EXPORTER__Global__AuthType  = "cloud"
